<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Neighborly Media Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#FFFFFF;--soft:#F3F6F8;--line:#D5DEE4;--navy:#020B1C;--ink:#0B1A2A;--muted:#6B7884;--blue:#007EBD;--cyan:#00CFFE;--deep:#6C21BC;--violet:#DE00FC;--err:#C2007F;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--soft);color:var(--ink);font-family:"Montserrat","Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:32px 28px;box-shadow:0 10px 30px rgba(2,11,28,.08)}
.stripe{display:flex;height:5px;width:160px;margin-bottom:22px}.stripe span{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
h1{font-size:24px;font-weight:900;line-height:1.15;margin:0 0 8px;color:var(--navy)}
p.sub{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.5}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,126,189,.15)}
button{font:inherit;font-weight:700;font-size:14px;padding:11px 18px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
button:hover{background:var(--blue)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--err);font-weight:600}
.msg.ok{color:var(--blue)}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="stripe" aria-hidden="true"><span style="background:var(--violet)"></span><span style="background:var(--deep)"></span><span style="background:var(--blue)"></span><span style="background:var(--cyan)"></span></div>
  <p class="eyebrow">Hawthorne Advertising &middot; Confidential</p>
  <h1>Neighborly media landscape</h1>
  <p class="sub">This dashboard is password protected. Sign in with the username and password you were given.</p>
  <form id="f" autocomplete="off">
    <label for="un">Username</label>
    <input id="un" type="text" autocomplete="username" autofocus required style="width:100%;margin-bottom:14px">
    <label for="pw">Password</label>
    <div class="row"><input id="pw" type="password" autocomplete="current-password" required aria-describedby="msg"><button id="go" type="submit">Open</button></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <p class="foot">The content is encrypted. It is decrypted in your browser only after the correct username and password are entered.</p>
</main>

<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var un=document.getElementById('un'),f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser can’t decrypt the page. Try a current version of Chrome, Edge, Safari or Firefox.';go.disabled=true;return}
f.addEventListener('submit',async function(e){e.preventDefault();go.disabled=true;msg.className='msg ok';msg.textContent='Checking…';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(un.value.trim().toLowerCase()+'\u0000'+pw.value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(err){msg.className='msg';msg.textContent='That username and password didn’t match. Check both and try again.';go.disabled=false;pw.select()}
});
})();
